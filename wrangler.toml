name = "wxbot"
main = "src/index.js"
compatibility_date = "2026-09-27"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
WEIXIN_CHANNEL_VERSION = "2.4.9"
WEIXIN_APP_ID = "bot"

[[d1_databases]]
binding = "WEIXIN_ACCOUNTS"
database_name = "weixin-accounts-db"
database_id = "5b1a09dd-15fb-4dde-a2a3-86b3510b824d"

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = true
